<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー</title>
    <style>
        @import url(./style.css);

        body {
            padding-bottom: 100px;
        }

        .fee-notice {
            text-align: center;
            max-width: 100%;
            overflow: hidden;
            border: 2px solid #ffde7c;
            border-radius: 10px;
            background-color: #FEFE7F;
            font-weight: bold;
            margin-bottom: 1em;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(175px, max-content));
            justify-content: center;
            gap: 1em;
            margin-bottom: 30px;
        }

        .item-container {
            position: relative;
            display: flex;
            width: 150px;
            height: 170px;
            padding: 1em;
            background-color: #8bf16f;
            border: 2px solid #55ab3e;
            border-radius: 20px;

        }

        .item-container img {
            display: block;
            position: absolute;
            max-width: 150px;
            max-height: 150px;
            object-fit: cover;
            align-items: center;
        }


        .item-container p {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            margin-top: 160px;
            padding: 0.5em;
            text-align: center;
            color: #000;
            font-weight: bold;
            pointer-events: none;
        }

        .allergy table {
            margin: auto;
            width: 100%;
            max-width: 800px;
            text-align: center;
            border-collapse: collapse;
            border: 2px solid;
        }

        caption {
            margin-bottom: 5px;
        }

        thead,
        tfoot {
            background-color: rgb(228, 240, 245);
        }

        th,
        td {
            font-weight: normal;
            border: 1px solid;
            padding: 8px, 10px;
        }
    </style>
</head>

<body>
    <nav class="nav-bar">
        <a href="index.html">
            <span class="icon">🏠</span>
            <span class="label">トップ</span>
        </a>
        <a href="game.html">
            <span class="icon">🎮️</span>
            <span class="label">ゲーム一覧</span>
        </a>
        <a class="current" href="menu.html">
            <span class="icon">🍔</span>
            <span class="label">メニュー</span>
        </a>
        <a href="gallery.html">
            <span class="icon">📷</span>
            <span class="label">ギャラリー</span>
        </a>
    </nav>
    <section class="fee-notice">
        <p>全品500円均一です!</p>
    </section>
    <section class="menu">
        <dev class="item-container">
            <img src="./img/test-onigiri.jpeg">
            <p>おにぎり</p>
        </dev>
        <dev class="item-container">
            <img src="./img/test-onigiri.jpeg">
            <p>おにぎり</p>
        </dev>
        <dev class="item-container">
            <img src="./img/test-onigiri.jpeg">
            <p>おにぎり</p>
        </dev>
    </section>
    <section class="allergy">
        <table>
            <caption>アレルギー対応表</caption>
            <thead>
                <tr>
                    <th scope="col">メニュー名</th>
                    <th scope="col">アレルゲン</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">おにぎり</th>
                    <th>水</th>
                </tr>
                <tr>
                    <th scope="row">いなり</th>
                    <th>入ってないやん</th>
                </tr>
            </tbody>
        </table>
    </section>
</body>

</html>
