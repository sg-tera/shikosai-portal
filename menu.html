<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニュー</title>
    <style>
        body {
            padding-bottom: 100px;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: blanchedalmond;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #e0e0e0;
            z-index: 1000;
        }

        .nav-bar a {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 12px;
            /* 楕円 */
            border: 1px solid brown;
            border-radius: 9999px;
            color: brown;
            min-width: 60px;
            background-color: azure;
        }

        .nav-bar .icon {
            font-size: 18px;
            line-height: 1;
        }

        .nav-bar a {
            font-size: 12px;
        }

        .nav-bar a.current {
            color: tomato;
            font-weight: bold;
        }

        .nav-bar a.current {
            border-color: tomato;
            background-color: rgba(255, 99, 71, 0.15);
        }


        .fee-notice {
            text-align: center;
            max-width: 100%;
            overflow: hidden;
            border: 2px solid #ffde7c;
            border-radius: 10px;
            background-color: #FEFE7F;
            font-weight: bold;
            margin-bottom: 1em;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(225px, max-content));
            justify-content: center;
            gap: 1em;
        }

        .item-container {
            position: relative;
            display: flex;
            width: 200px;
            height: 235px;
            padding: 1em;
            background-color: #8bf16f;
            border: 2px solid #55ab3e;
            border-radius: 20px;

        }

        .item-container img {
            display: block;
            position: absolute;
            max-width: 200px;
            max-height: 200px;
            object-fit: cover;
            align-items: center;
        }


        .item-container p {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            margin-top: 210px;
            padding: 0.5em;
            text-align: center;
            color: #000;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <nav class="nav-bar">
        <a href="index.html">
            <span class="icon">🏠</span>
            <span class="label">トップ</span>
        </a>
        <a href="game.html">
            <span class="icon">🎮️</span>
            <span class="label">ゲーム一覧</span>
        </a>
        <a class="current" href="menu.html">
            <span class="icon">🍔</span>
            <span class="label">メニュー</span>
        </a>
        <a href="gallery.html">
            <span class="icon">📷</span>
            <span class="label">ギャラリー</span>
        </a>
    </nav>
    <section class="fee-notice">
        <p>全品500円均一です!</p>
    </section>
    <section class="menu">
        <dev class="item-container">
            <img src="./img/test-onigiri.jpeg">
            <p>おにぎり</p>
        </dev>
        <dev class="item-container">
            <img src="./img/test-onigiri.jpeg">
            <p>おにぎり</p>
        </dev>
        <dev class="item-container">
            <img src="./img/test-onigiri.jpeg">
            <p>おにぎり</p>
        </dev>
    </section>
</body>

</html>
