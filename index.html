    <style>
        @import url(./style.css);

        body {
            font-family: sans-serif;
            text-align: center;
            padding-bottom: 100px;
            min-width: 350px;
        }

        h2 {
            text-align: left;
            padding-left: 1em;
        }

        .location h2 {
            margin-top: 50px;
            line-height: 0.5;
        }

        .location p {
            font-size: 18px;
            font-weight: bold;
            color: darkorange;
            margin-top: 0%;
            margin-bottom: 0%;
        }

        .location img {
            width: 90%;
            max-width: 700px;
            margin-bottom: 1%;
        }

        .fee h2 {
            font-size: 24px;
            line-height: 0.5;
            margin-bottom: 1%;
        }

        .fee ul {
            padding-left: 0;
            display: inline-block;
        }

        .fee li {
            text-align: left;
            font-size: large;
        }

        .links {
            display: flex;
            flex-direction: row;
            justify-content: center;
            margin-top: 50px;
            gap: 20%;
        }

        .sns {
            width: 100px;
            height: 100px;
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .sns img {
            display: block;
            width: 100px;
            height: 100px;
            opacity: 0.5;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .overlay-text {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
</head>
