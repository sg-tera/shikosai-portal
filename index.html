<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
    <style>
        @import url(./style.css);

        body {
            margin-left: auto;
            margin-right: auto;
            max-width: 896px;
            background-color: #f2efe6;
            color: #333333;
            font-family: sans-serif-apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Sans", sans-serif;
            text-align: center;
            padding-bottom: 100px;
            min-width: 352px;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 72px;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.05);
        }

        .nav-bar a {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 12px;
            min-width: 64px;
            color: #8b8b8b;
        }

        .nav-bar a {
            font-size: 12px;
        }

        .nav-bar a.current {
            color: #2A5934;
            font-weight: bold;
        }

        h2 {
            text-align: left;
            padding-left: 1em;
            margin-top: 50px;
        }

        .location p {
            font-size: 18px;
            font-weight: bold;
            color: darkorange;
            margin-top: 0%;
            margin-bottom: 0%;
        }

        .location img {
            width: 90%;
            max-width: 720px;
            margin-bottom: 1%;
        }

        .fee ul {
            padding-left: 0;
            display: inline-block;
        }

        .fee li {
            text-align: left;
            font-size: large;
        }

        #menu {
            padding: 1px clamp(16px, 4vw, 40px) 32px;
            margin-top: 50px;
            text-align: left;
        }

        #menu h2 {
            padding-left: 0;
            margin-top: 32px;
        }

        .meal-list {
            display: grid;
            gap: 20px;
        }

        .meal {
            --image-size: 160px;
            position: relative;
            isolation: isolate;
            display: grid;
            grid-template-columns: var(--image-size) minmax(0, 1fr);
            align-items: center;
            gap: 28px;
            padding: 28px 28px 28px 0;
        }

        /* 写真の半分を白いカードの外側に重ねる */
        .meal::before {
            content: "";
            position: absolute;
            inset: 0 0 0 calc(var(--image-size) / 2);
            background-color: #fff;
            z-index: -1;
        }

        .meal img {
            display: block;
            width: var(--image-size);
            aspect-ratio: 1;
            object-fit: cover;
        }

        .meal-content {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .meal h3 {
            margin: 0 0 28px;
            font-size: clamp(22px, 3vw, 28px);
            line-height: 1.4;
        }

        .meal p {
            margin: 0;
            line-height: 1.8;
        }

        .links {
            font-style: normal;
        }

        .sns-container {
            font-style: normal;
            display: flex;
            flex-direction: row;
            justify-content: center;
            margin-top: 48px;
            gap: 20%;
        }

        .sns img {
            display: block;
            width: 80px;
            height: 80px;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            margin-bottom: 32px;
        }
    </style>
</head>
