name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Minify HTML & Inline CSS
        run: |
          npx html-minifier-terser \
            --input-dir src \
            --output-dir src \
            --file-ext html \
            --collapse-whitespace \
            --remove-comments \
            --minify-css true

      - name: Force Push to publish branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish
          git add -A
          git commit -m "Deploy from main [skip ci]"
          git push -f origin publish